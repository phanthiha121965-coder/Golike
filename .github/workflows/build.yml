name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Lấy mã nguồn về máy chủ
        uses: actions/checkout@v4

      - name: Cài đặt Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt Buildozer và các công cụ biên dịch
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython

      - name: Đóng gói APK bằng Buildozer
        run: |
          buildozer android debug

      - name: Upload file APK lên GitHub
        uses: actions/upload-artifact@v4
        with:
          name: GolikeMaster-APK
          path: bin/*.apk
